data:
  split_path: '/fast_scratch_4/WatChMaL/t2k/ml/output_skdetsim/jun4_eMuPiPlus_full_combine_bugFix_1/train_val_test_gt100Hits_fcM50_2000MeVCut_nFolds60_fold0.npz' 
  dataset:
    h5file: '$SLURM_TMPDIR/multi_combine.hy'
    _target_: watchmal.dataset.cnn.cnn_dataset.CNNDatasetDeadPMT
    pmt_positions_file: /home/fcormier/t2k/ml/training/t2k_ml_training/data/skdetsim_imagefile.npy
    use_positions: False
    use_relativeTimes: False
    use_triggerTimes: True
    geometry_file: /home/fcormier/t2k/ml/training/t2k_ml_training/data/geofile_skdetsim.npz
    channel_scaling:
      #time: [400, 1000]
      #Shift
      #time: [0, 100]
      time: [-600, 1000]
      #Relative
      #time: [0, 100]
    #change_dead_pmts: True
    #dead_pmt_var: 0.01
    #dead_pmt_rate: 0.01
    #use_hit_mask: True
model:
  _target_: watchmal.model.resnet.resnet50
  num_input_channels: 2
  num_output_channels: 3
  stride: 1
  kernelSize: 3
  dropout_p: 0.2
  conv_pad_mode: 'circular'
engine:
  _target_: watchmal.engine.classification.ClassifierEngine
  truth_key: 'labels'
  label_set: [0,1,2]
  mixup_alpha: 0.2
tasks:
  restore_best_state:
    name: ClassifierEngine_ResNet
  train:
    epochs: 50
    val_interval: 1000
    num_val_batches: 100
    checkpointing: false
    loss:
      _target_: torch.nn.CrossEntropyLoss
      label_smoothing: 0.0
    data_loaders:
      train:
        split_key: train_idxs
        batch_size: 100
        num_workers: 4
        sampler:
          _target_: torch.utils.data.sampler.SubsetRandomSampler
      validation:
        split_key: val_idxs
        batch_size: 500
        num_workers: 4
        sampler:
          _target_: torch.utils.data.sampler.SubsetRandomSampler
    optimizers:
      _target_: torch.optim.Adam
      lr: 0.01
      weight_decay: 0
    scheduler:
      _target_: torch.optim.lr_scheduler.ExponentialLR
      gamma: 0.8
  evaluate:
    data_loaders:
      test:
        split_key: test_idxs
        batch_size: 2000
        num_workers: 6
        sampler:
          _target_: torch.utils.data.sampler.SubsetRandomSampler
gpu_list: 
- 0
- 1
seed: null
dump_path: ./outputs/
