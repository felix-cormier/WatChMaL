model:
  _target_: watchmal.model.resnet.resnet18
  num_input_channels: 2
  num_output_channels: 3
  stride: 1
  kernelSize: 1
  dropout_p: 0.
  conv_pad_mode: 'circular'
engine:
  _target_: watchmal.engine.regression.RegressionEngine
  truth_key: 'positions'
  eval_directory: 'MC_OP0p1_stopMu'
tasks:
  restore_best_state:
    name: RegressionEngine_ResNet
  evaluate:
    loss:
      _target_: torch.nn.HuberLoss
      delta: 0.1
    optimizers:
      _target_: torch.optim.Adam
      lr: 0.001
      weight_decay: 0
    data_loaders:
      test:
        split_key: test_idxs
        batch_size: 400
        num_workers: 2
        sampler:
          #_target_: torch.utils.data.sampler.SubsetRandomSampler
          _target_: watchmal.dataset.samplers.SubsetSequentialSampler
